plugins { id 'com.android.application' }
android {
    namespace 'com.starmasti.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.starmasti.app'   // पहले से Play Store पर ऐप है तो यहाँ वही package नाम लिखें
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.unity3d.ads:unity-ads:4.12.5'   // नया संस्करण उपलब्ध हो तो बदल सकते हैं
}
